<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lehigh Transit Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <h2>Campus Routes</h2>
            <ul class="route-list" id="route-list">
                <!-- Routes will be injected dynamically from JSON -->
            </ul>

            <div style="margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1rem;">
                <h2>Regional Hub</h2>
                <div id="connections-container"></div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h1>Lehigh Transit Tracker</h1>
                <div id="external-links"></div>
            </header>

            <!-- Route Search Bar -->
            <form class="search-bar" id="search-form">
                <input type="text" id="start-stop" placeholder="Departure stop..." required>
                <input type="text" id="end-stop" placeholder="Destination stop..." required>
                <button type="submit" class="btn-find">Find Route</button>
            </form>

            <!-- Map View / Route Information Display -->
            <div class="map-placeholder" id="display-area">
                <p>Select a route from the sidebar to view schedules and live information.</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
